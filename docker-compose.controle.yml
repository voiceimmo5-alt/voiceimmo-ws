version: "3.8"

services:
  voiceimmo-ws-controle:
    build:
      context: .
      dockerfile: Dockerfile.controle
    container_name: voxzen-controle
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - BASE44_APP_URL=${BASE44_APP_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SERVER_BASE_URL=https://controle.voxzen.io
      - SERVICE_VERTICAL=CONTROLE_REGLEMENTAIRE
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

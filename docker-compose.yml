# ============================================
# VoiceImmo WS — Docker Compose
# Prod  : port 8080 → ws.voiceimmo.fr
# Staging: port 8081 → ws-staging.voiceimmo.fr
# ============================================
version: '3.8'

services:

  voiceimmo-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: voiceimmo-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    labels:
      - "version=v31-prod"
      - "env=production"

  voiceimmo-staging:
    build:
      context: .
      dockerfile: Dockerfile.staging
    container_name: voiceimmo-staging
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env.staging
    labels:
      - "version=v31-staging"
      - "env=staging"

